version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - app-network

  mcp-server:
    build:
      context: ./mcp
      dockerfile: Dockerfile.mcp
    container_name: mcp-server
    restart: always
    environment:
      - MONGO_HOST=mongodb
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - API_KEY=${API_KEY}
      - ENDPOINT=${ENDPOINT}
      - AI_MODEL=${AI_MODEL}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mongodb
    networks:
      - app-network

  shiny-ai-ioc:
    build:
      context: ./shinyapp
      dockerfile: Dockerfile.shiny
    image: shiny-ai-ioc
    container_name: shiny-ai-ioc
    restart: unless-stopped
    ports:
      - "127.0.0.1:3838:3838"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - MCP_SERVER_URL=http://mcp-server:8000
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - APP_URL=${APP_URL}
    depends_on:
      - mongodb
      - mcp-server
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
